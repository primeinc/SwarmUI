name: Unit Tests

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
            fetch-tags: true
        - uses: actions/setup-dotnet@v5
          with:
            dotnet-version: '8.x'
        - run: bash ./launchtools/run_tests.sh
        # These checks are deliberately only syntax checks. They do not imply
        # that Qwen segment LoRA weights were matched or applied during inference.
        - name: Validate live acceptance test syntax (NOT inference)
          run: python3 -m py_compile tests/live/test_qwen_segment_lora.py tests/live/test_segment_lora_browser.py tests/integration/qwen_segment_text_replacement.py
        - name: Validate production Python syntax (NOT inference)
          run: python3 -m py_compile src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyCommon/SwarmQwen.py src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyCommon/SwarmText.py
        - name: Validate browser JS syntax (NOT browser execution)
          run: node --check src/wwwroot/js/genpage/gentab/loras.js
