name: Unit Tests

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
            fetch-tags: true
        - uses: actions/setup-dotnet@v5
          with:
            dotnet-version: '8.x'
        - name: Run C# graph tests and export actual Qwen segment reproduction graph
          env:
            SWARM_QWEN_EXPORT_GRAPH: /tmp/swarm-qwen-production-graph.json
          run: bash ./launchtools/run_tests.sh
        - name: Exercise native Qwen empty-negative tokenizer flags (CPU, NOT inference)
          run: python3 -m unittest discover -s tests -p test_qwen21_empty_token_cpu.py -v
        - name: Validate actual generated Qwen graph with no-model Python acceptance preflight
          run: |
            test -s /tmp/swarm-qwen-production-graph.json
            python3 tests/integration/qwen_segment_text_replacement.py --workflow /tmp/swarm-qwen-production-graph.json --preflight-only
        # These checks are deliberately only syntax checks. They do not imply
        # that Qwen segment LoRA weights were matched or applied during inference.
        - name: Validate vendored upstream Qwen node and production routing (NOT inference)
          run: python3 -m unittest discover -s tests -p test_qwen_native_bundle.py -v
        - name: Validate live acceptance test syntax (NOT inference)
          run: python3 -m py_compile tests/live/test_qwen_segment_lora.py tests/live/test_segment_lora_browser.py tests/integration/qwen_segment_text_replacement.py
        - name: Validate production and byte-identical bundled Comfy plugins (NOT inference)
          run: python3 -m py_compile src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/ComfyQwenNodes_Upstream.py src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/ComfyInpaintCropAndStitch/__init__.py src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/ComfyInpaintCropAndStitch/inpaint_cropandstitch.py src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/LanPaintUpstream/__init__.py src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/LanPaintUpstream/src/LanPaint/nodes.py src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyCommon/SwarmText.py src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyCommon/SwarmKSampler.py src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/SwarmComfyCommon/SwarmMasks.py tests/test_qwen_segment_mask_guard.py
        - name: Validate browser JS syntax (NOT browser execution)
          run: node --check src/wwwroot/js/genpage/gentab/loras.js

    crop-stitch-cpu:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-python@v6
          with:
            python-version: '3.12'
        # Exercise upstream real-tensor crop/stitch behavior, not mocks or
        # handrolled imitations. This does not imply a Qwen GPU acceptance pass.
        - name: Install CPU tensor dependencies for upstream CropAndStitch tests
          run: |
            python3 -m pip install 'numpy<3' pillow scipy
            python3 -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        - name: Run shipped Swarm prompt tag parser CPU controls
          run: python3 -m unittest discover -s tests -p test_qwen_swarm_prompt_parser_cpu.py -v
        - name: Run offline exported-Qwen-graph preflight negative controls
          run: python3 -m unittest discover -s tests -p test_qwen_segment_preflight_offline.py -v
        - name: Prove LoRA inside-mask effect metric rejects outside leaks (CPU)
          run: python3 -m unittest discover -s tests -p test_qwen_segment_lora_confinement_cpu.py -v
        - name: Run CPU-tensor segment detection guard controls
          run: python3 -m unittest discover -s tests -p test_qwen_segment_mask_guard.py -v
        - name: Test real-tensor replacement without old-subject ghosting
          env:
            PYTHONPATH: src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/ComfyInpaintCropAndStitch
          run: python3 -m unittest discover -s tests -p test_qwen_crop_replacement_cpu.py -v
        - name: Run unmodified upstream CropAndStitch round-trip and mask tests
          env:
            PYTHONPATH: src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/ComfyInpaintCropAndStitch
          run: python3 -m unittest discover -s src/BuiltinExtensions/ComfyUIBackend/ExtraNodes/ComfyInpaintCropAndStitch/tests -p 'test_*.py' -v
