name: C# Build And Checks

on:
    push:
    pull_request:

# An older branch head cannot prove the current PR; cancel obsolete runs.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-check:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
            fetch-tags: true
        - uses: actions/setup-dotnet@v5
          with:
            dotnet-version: '8.x'
        - run: dotnet build SwarmUI.sln --configuration Release
        - run: dotnet format --verify-no-changes
        - run: dotnet format style --verify-no-changes

    ci-test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
            fetch-tags: true
        - uses: actions/setup-dotnet@v5
          with:
            dotnet-version: '8.x'
        - run: ./launch-linux.sh --ci-test true --launch_mode none --loglevel debug

    ci-test-extensions:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
            fetch-tags: true
        - uses: actions/setup-dotnet@v5
          with:
            dotnet-version: '8.x'
        - run: ./launch-linux.sh --ci-test true --ci-test-extensions true --launch_mode none --loglevel debug
