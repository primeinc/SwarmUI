name: Cancel obsolete dev Actions runs

# One-time cleanup on installation. Also supports explicit re-run from Actions.
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/cancel-obsolete-dev-runs.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-obsolete-dev-runs
  cancel-in-progress: false

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel superseded Unit Tests and C# Build runs on dev
        shell: bash
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          current_run_id = int(os.environ["GITHUB_RUN_ID"])
          token = os.environ["GH_ACTIONS_TOKEN"]
          base = f"https://api.github.com/repos/{repository}"
          statuses = ("queued", "in_progress", "waiting", "pending", "requested")
          workflows = {
              ".github/workflows/unit-tests.yml",
              ".github/workflows/build-and-check.yml",
          }

          def request(method, path):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "SwarmUI-one-time-actions-cleanup",
              }
              url = f"{base}{path}"
              for attempt in range(5):
                  req = Request(url, headers=headers, method=method,
                                data=b"" if method == "POST" else None)
                  try:
                      with urlopen(req, timeout=30) as response:
                          if response.status == 202 or response.status == 204:
                              return {"status": response.status}
                          data = response.read()
                          return json.loads(data) if data else {}
                  except HTTPError as exc:
                      message = exc.read().decode("utf-8", errors="replace")
                      if exc.code == 409 and method == "POST":
                          # Run completed between enumeration and cancellation.
                          return {"status": 409}
                      is_throttled = exc.code == 429 or (
                          exc.code == 403 and "rate limit" in message.lower())
                      if is_throttled or exc.code in (500, 502, 503, 504):
                          if attempt < 4:
                              delay = min(30, 2 ** (attempt + 1))
                              print(f"GitHub returned {exc.code}; retry in {delay}s",
                                    flush=True)
                              time.sleep(delay)
                              continue
                      raise RuntimeError(
                          f"GitHub {method} {path} returned {exc.code}: "
                          f"{message[:400]}") from exc
              raise RuntimeError(f"GitHub {method} {path} failed after retries")

          def dev_head():
              return request("GET", "/git/ref/heads/dev")["object"]["sha"]

          # Snapshot the full list BEFORE canceling: deleting entries while
          # paginating would skip runs as the list shrinks.
          target = {}
          for status in statuses:
              for page in range(1, 31):
                  data = request("GET", "/actions/runs?branch=dev"
                                 f"&status={status}&per_page=100&page={page}")
                  batch = data.get("workflow_runs", [])
                  for run in batch:
                      if (run["id"] != current_run_id
                              and run.get("path") in workflows
                              and run.get("head_branch") == "dev"
                              and run.get("status") in statuses):
                          target[run["id"]] = run
                  if len(batch) < 100:
                      break
              else:
                  raise RuntimeError(
                      f"More than 3000 '{status}' dev runs; refusing partial scan")

          head_sha = dev_head()
          obsolete = [run for run in target.values()
                      if run["head_sha"] != head_sha]
          obsolete.sort(key=lambda run: run["id"])
          print(f"Current dev HEAD: {head_sha}", flush=True)
          print(f"Candidate active dev runs: {len(target)}", flush=True)
          print(f"Obsolete runs eligible for cancellation: {len(obsolete)}",
                flush=True)

          accepted = conflicts = 0
          errors = []
          for index, run in enumerate(obsolete, 1):
              try:
                  # Refresh HEAD before each request so concurrent pushes
                  # cannot cause cancellation of the current commit's checks.
                  latest = dev_head() if index == 1 or index % 25 == 0 else head_sha
                  head_sha = latest
                  if run["head_sha"] == latest:
                      continue
                  result = request(
                      "POST", f"/actions/runs/{run['id']}/cancel")
                  if result.get("status") == 202:
                      accepted += 1
                  elif result.get("status") == 409:
                      conflicts += 1
                  else:
                      errors.append((run["id"], result))
              except Exception as exc:
                  errors.append((run["id"], str(exc)))
              if index % 25 == 0 or index == len(obsolete):
                  print(f"{index}/{len(obsolete)} processed; "
                        f"{accepted} cancel requests accepted, "
                        f"{conflicts} already ended, {len(errors)} errors",
                        flush=True)
              time.sleep(0.15)

          print(f"RESULT accepted={accepted} ended={conflicts} "
                f"errors={len(errors)}", flush=True)
          if errors:
              for run_id, detail in errors[:20]:
                  print(f"FAILED run={run_id}: {detail}", file=sys.stderr)
              sys.exit(1)
          PY
